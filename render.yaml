# Render Blueprint: public SIMULATED demo of Deploy by Command.
# MODE is fixed to mock (nothing touches AWS, SSH or Docker) and every request needs ACCESS_TOKEN.
# Open the dashboard at:  https://<your-service>.onrender.com/?token=<ACCESS_TOKEN>
# (ACCESS_TOKEN is generated by Render: Dashboard -> your service -> Environment.)
services:
  - type: web
    name: deploy-by-command-demo
    runtime: node
    plan: free
    region: singapore
    buildCommand: cd backend && npm ci && cd ../frontend && npm ci && npm run build
    startCommand: cd backend && node src/server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: MODE
        value: mock
      - key: ALLOW_REAL_AWS
        value: "no"
      - key: PUBLIC_DEMO
        value: "1"
      - key: HOST
        value: 0.0.0.0
      - key: ACCESS_TOKEN
        generateValue: true
      - key: MOCK_DELAY_MS
        value: "700"
      - key: ENV_FILE
        value: /nonexistent.env
      # Optional: add GEMINI_API_KEY in the Render dashboard (never in this file).
