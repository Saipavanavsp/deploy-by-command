<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deployed by Command</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #0f172a; color: #e2e8f0;
    }
    main { max-width: 640px; padding: 2.5rem 2rem; text-align: center; }
    .badge {
      display: inline-block; padding: .3rem .8rem; border-radius: 999px;
      background: #14532d; color: #bbf7d0; font-size: .85rem; letter-spacing: .03em;
    }
    h1 { font-size: clamp(2rem, 5vw, 3rem); margin: 1rem 0 .5rem; }
    p { color: #94a3b8; line-height: 1.6; }
    code { background: #1e293b; padding: .15rem .4rem; border-radius: 4px; color: #e2e8f0; }
    footer { margin-top: 2rem; font-size: .8rem; color: #64748b; }
  </style>
</head>
<body>
  <main>
    <span class="badge">● Online</span>
    <h1>Deployed by Command</h1>
    <p>This page was deployed from a plain-English command. A language model picked one approved action, and the backend launched the server, installed Docker and started this container.</p>
    <p>Health: <code>/health</code> · Info: <code>/info</code></p>
    <footer>Sample app for <em>Deploy by Command</em></footer>
  </main>
</body>
</html>
